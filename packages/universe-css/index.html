<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Universe CSS</title>
        <link href="./universe.css" rel="stylesheet" />
    </head>

    <body>
        <div class="container">
            <h1>Universe CSS</h1>
            <h2>Common styles that can be reused anywhere.  It's just CSS!</h2>

            This text has been placed nicely in a little container.
        </div>
        
        <div class="container-fluid">
            <h1>This is a fluid container</h1>

            <div class="grid space-between">
                <div>
                    Containing a grid space between.
                </div>
                <div>
                    Of equal
                </div>
                <div>
                    Columns
                </div>
            </div>

            <hr/>

            <div class="grid space-evenly">
                <div>
                    Containing a grid space evenly.
                </div>
                <div>
                    Of equal
                </div>
                <div>
                    Columns
                </div>
            </div>
        </div>

        <div class="container">
            <button type="button" class="primary">
                Primary Button
            </button>
            <button type="button" class="secondary">
                Secondary Button
            </button>
        </div>
    </body>
</html>
